name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh -S error install.sh bin/open-debate lib/*.sh template/skills/architect-debate/scripts/*.sh test/run.sh test/stub/*

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh test/run.sh

  # Every push to main that passes lint and tests becomes the stable version: install.sh and `open-debate upgrade`
  # download the stable tag, and existing installs get the new-version notice within 1 day.
  stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag -f stable "$GITHUB_SHA"
          git push -f origin refs/tags/stable
