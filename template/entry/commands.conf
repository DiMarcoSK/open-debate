# The commands installed in every harness, 1 per line: name|argument hint|description (Gemini and Qwen command).
# Each one has entry/<name>/subagents.md (harnesses with subagents) and entry/<name>/cli.md (headless harnesses),
# rendered into skills/<name>/SKILL.md, and commands/<name>.md for opencode. A {{DELEGATION}} line pulls in delegation.md.
debate|<idea>|Architecture and design debate: from an idea to SDD, ADRs, specs and backlog
opd-brainstorm|<theme>|Brainstorm a theme into 3-5 proposals that fit this product and avoid the obvious, then seed a debate case from the pick
