# Profile: free (cost 0) | mixed (strong only on debate, judge, auditor and arch) | strong (strong on all, spends more).
# Switch: open-debate models profile mixed anthropic/claude-sonnet-5-5. strong = any id from `opencode models`.
# agent=model: opencode free models, different families so parallel calls do not fight over one limit and opinions differ.
# Apply: open-debate models apply. Check: open-debate models check. Spare: 1st replacement for a model that left the catalog.
# Fallback: models tried in order, before the spare and the rest of the free catalog, when an agent's model runs out of quota
# in the middle of a debate (open-debate models next <case> <agent>). Space separated, ex: fallback=anthropic/claude-haiku-5-5
profile=free
strong=
debate=opencode/beam-free
debate-research=opencode/beam-free
debate-scout=opencode/nemotron-3.5-lightning-free
debate-judge=opencode/nemotron-3.5-super-vl-free
debate-arch=opencode/deepseek-v4.1-flash-free
debate-design=opencode/glm-5.3-flash-free
debate-ux=opencode/nemotron-3.5-super-vl-free
debate-brand=opencode/glm-5.3-flash-free
debate-gcp=opencode/flint-40b-free
debate-k8s=opencode/big-pickle
debate-pm=opencode/mimo-v2.6-flash-free
debate-sec=opencode/mimo-v2.6-flash-free
debate-aws=opencode/flint-40b-free
debate-data=opencode/deepseek-v4.1-flash-free
debate-ai=opencode/mimo-v2.6-flash-free
debate-mobile=opencode/big-pickle
debate-auditor=opencode/glm-5.3-flash-free
spare=opencode/big-pickle
fallback=
