# Brainstorm lenses, 1 per line: id|idea prefix|name|move|stimuli separated by ;
# brainstorm.sh new seats `analogy` and draws the other lenses, and 1 stimulus per lens, with a seed outside the model:
# a model asked to be random gives every user the same "random" pick. The draw is in meta.txt; SEED=<n> repeats it.
# The move is what the ideator does with the stimulus; references/brainstorm.md says where each lens comes from.
analogy|AN|Far analogy|Take a mechanism that works in the domain below and transfer its structure, not its surface, to a job in ground.md. Name the source mechanism, what maps to what, and what breaks in the transfer.|air traffic control;beekeeping;Formula 1 pit stops;emergency room triage;interlibrary loan;jazz improvisation;container shipping;restaurant kitchen brigades;sommeliers;seed banks;museum curation;weather forecasting;the immune system;ant colonies;casino floor design;video game speedrunning;open-source maintainers;hotel concierges;aviation checklists;stock exchange auctions;sports scouting;theater rehearsals;postal sorting;blood banks;tattoo flash sheets;bonsai;geocaching;Wikipedia edit disputes;orchestra conducting;crop rotation;bird migration;escrow;insurance underwriting;lifeguarding;radio DJs;forensic accounting;mountain rescue;Swiss-system tournaments;LEGO building instructions;perfume composition;military after-action reviews;crossword construction;harbor pilots;book clubs;air quality monitoring;carpool lanes;vending machines;food trucks;subway maps;sourdough starters
inversion|IN|Inverted assumption|From the category conventions in ground.md, write the 3 assumptions every product in the category shares. Apply the move below to the one it fits best and design what the product becomes.|eliminate a step every product takes for granted;reduce one feature far below the category standard;raise one factor far above the category standard;create what the category never offers;make the user do less, not more;make what is private shared;make what is shared private;make what is instant deliberately slow;move the work from before the event to after it;move the work from the user to the system;charge for what is free or free what is charged;serve the user the category ignores;turn the output into the input
outcome|OU|Underserved outcome|Pick the outcome in ground.md (Users and pains) that matters most to the user below and that today's products satisfy least. Design for that user first, quoting the pain.|a first-day novice;a power user at 10x the usual volume;someone who quit the product last month;someone using it on a phone with one hand;a user with low vision;the manager who never opens the product;someone on unstable internet;a team of 1;a team of 500;someone under deadline at 2 a.m.;a non-native speaker;an auditor reading the output a year later;a competitor's most loyal user;someone who still does this in a spreadsheet;someone who must explain the result to a customer
enabler|EN|Why now|Use the change below (from ground.md Shifts, or 1 debate-scout question) that made something possible or cheap in the last 24 months, and build the idea that was not viable before it.|a model capability that became 10x cheaper;a new open protocol or standard;a regulation that took effect;a platform API that opened;a behavior that became normal recently;a hardware capability now in most phones;an open-source project that turned a former moat into a commodity;a data source that became public;instant payments;real-time collaboration in the browser
model|BM|Business model shift|Change how the product creates or captures value, not what it does, through the lever below (Ten Types of Innovation). Name who pays, for what, and why they would switch.|profit model: who pays and for what;network: a partner who brings the users;process: the way the work gets done;product system: a complement that makes the core worth more;service: what happens around the product;channel: where the user meets it;brand: what using it says about the user;customer engagement: a ritual users return to
constraint|CO|Extreme constraint|Solve the core job in ground.md under the constraint below. Keep what still works without it: that is the idea.|it has no screen;it costs 1/10 of today;it serves 10x the users;it works offline;it is done in under 10 seconds;it is a single button;it needs no account;the user never types;an auditor can follow every step;it is fun;1 person builds it in 1 week
